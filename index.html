<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FutLive CE</title>
  
  <link rel="stylesheet" href="style.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XZ1XEW3FZ3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XZ1XEW3FZ3');
  </script>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <a href="index.html" class="brand">
        <img src="logo.png" alt="FutliveCE" class="logo" />
      </a>
      
      <div class="social-links">
      <a href="tabela.html" class="social-btn tabela">
        <i class="fa-solid fa-table-list"></i>
        <span>Tabela</span>
      </a>

      <div class="social-links">
        <a href="https://www.instagram.com/futlivece/" target="_blank" class="social-btn instagram">
          <i class="fa-brands fa-instagram"></i>
          <span>Instagram</span>
        </a>
        <a href="https://whatsapp.com/channel/0029Vb7J4UEFnSzGO7ZTZD1h" target="_blank" class="social-btn whatsapp">
          <i class="fa-brands fa-whatsapp"></i>
          <span>WhatsApp</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <section id="homePage" class="page active">
      <section class="hero">
        <div class="container hero-content">
          <div class="hero-text">
            <h1>FUTLIVE CE</h1>
            <p>Transmissão de jogos do Fortaleza EC e Ceará SC.</p>
          </div>
          <div class="hero-box">
            <img src="logo.png" alt="FutliveCE" class="hero-logo" />
          </div>
        </div>
      </section>

      <section id="transmissoes" class="matches-section">
        <div class="container">
          <h2 class="section-title">Próximas transmissões</h2>

          <div class="matches-grid">
            
            <a href="ceara.html" class="match-card ceara-card" style="text-decoration: none;">
              <div class="teams-display">
                <img src="https://upload.wikimedia.org/wikipedia/pt/6/6d/Maranh%C3%A3o_Atl%C3%A9tico_Clube.png" alt="Maranhao" class="team-shield" />
                <span class="vs-badge">VS</span>
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/01/Cear%C3%A1_Sporting_Club_logo.png" alt="Ceará" class="team-shield" />
              </div>
              <div class="match-details">
                <p class="match-date">QUARTA • 29/04</p>
                <p class="match-time">21:30</p>
              </div>
              <div class="card-action">
                <button class="btn-watch-now">
                  <i class="fa-solid fa-play"></i> ASSISTIR
                </button>
              </div>
            </a>

            <a href="fortaleza.html" class="match-card fortaleza-card" style="text-decoration: none;">
              <div class="teams-display">
                <img src="https://logodetimes.com/times/fortaleza/logo-fortaleza-256.png" alt="Fortaleza" class="team-shield" />
                <span class="vs-badge">VS</span>
                <img src="https://upload.wikimedia.org/wikipedia/pt/1/17/Sport_Club_do_Recife.png" alt="Sport" class="team-shield" />
              </div>
              <div class="match-details">
                <p class="match-date">QUARTA • 29/04</p>
                <p class="match-time">21:30</p>
              </div>
              <div class="card-action">
                <button class="btn-watch-now">
                  <i class="fa-solid fa-play"></i> ASSISTIR
                </button>
              </div>
            </a>

          </div>

          <div class="promo-banner">
            <a href="https://wa.me/5585998348426?text=Ol%C3%A1%2C%20vim%20atraves%20do%20site." target="_blank">
              <img src="banner.png" alt="Teste IPTV grátis" />
            </a>
          </div>
        </div>
      </section>
    </section>

    </main>

  <script src="script.js"></script>

  <script>
    // Limpeza de cache para garantir que os novos links funcionem
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>
</body>
</html>
