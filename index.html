<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="https://i.imgur.com/GfxZJSo.png" type="image/png" />
  <title>FutLive CE</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XZ1XEW3FZ3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-XZ1XEW3FZ3");
  </script>
</head>

<body>
  <header class="header">
    <div class="container header-content">
      <a href="index.html" class="brand">
        <img src="logo.png" alt="FutLive CE" class="logo" />
      </a>

      <div class="social-links">
        <a href="tabela.html" class="social-btn tabela">
          <i class="fa-solid fa-table-list"></i>
          <span>Tabela</span>
        </a>

        <a href="https://www.instagram.com/futlivece/" target="_blank" class="social-btn instagram">
          <i class="fa-brands fa-instagram"></i>
          <span>Instagram</span>
        </a>

        <a href="https://whatsapp.com/channel/0029Vb7J4UEFnSzGO7ZTZD1h" target="_blank" class="social-btn whatsapp">
          <i class="fa-brands fa-whatsapp"></i>
          <span>WhatsApp</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <section id="transmissoes" class="matches-section">
      <div class="container">
        <h2 class="section-title">Próximas transmissões</h2>

        <div class="matches-grid">


          <a href="fortaleza.html" class="match-card fortaleza-card">
            <div class="teams-display">
              <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/AD_Confianca.png/500px-AD_Confianca.png" alt="Fortaleza" class="team-shield" />
              <span class="vs-badge">VS</span>
              <img src="https://logodetimes.com/times/fortaleza/logo-fortaleza-256.png" alt="Goiás" class="team-shield" />
            </div>

            <div class="match-details">
              <p class="match-date">Quinta • 07/05</p>
              <p class="match-time">19:30</p>
            </div>

            <div class="card-action">
              <button class="btn-watch-now" type="button">
                <i class="fa-solid fa-play"></i> Assistir
              </button>
            </div>
          </a>

          <a href="ceara.html" class="match-card ceara-card">
            <div class="teams-display">
              <img src="https://upload.wikimedia.org/wikipedia/commons/0/01/Cear%C3%A1_Sporting_Club_logo.png" alt="vit" class="team-shield" />
              <span class="vs-badge">VS</span>
              <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Atl%C3%A9tico_Goianiense.svg/960px-Atl%C3%A9tico_Goianiense.svg.png" alt="Ceará" class="team-shield" />
            </div>

            <div class="match-details">
              <p class="match-date">Sábado • 09/05</p>
              <p class="match-time">19:00</p>
            </div>

            <div class="card-action">
              <button class="btn-watch-now" type="button">
                <i class="fa-solid fa-play"></i> Assistir
              </button>
            </div>
          </a>
   
        </div>
      </div>
    </section>

    <section class="intro-bottom">
      <div class="container">
        <h1>FUTLIVE CE</h1>
        <p>Transmissão de jogos do Fortaleza EC e Ceará SC.</p>
      </div>
    </section>
  </main>
</body>
</html>
